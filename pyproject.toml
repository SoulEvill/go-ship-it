[project]
name = "go-ship-it"
version = "0.1.0"
description = "Local-first issue lifecycle and worktree orchestration for agent-assisted development."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
go-ship-it = "go_ship_it.cli:main"

[tool.hatch.build]
exclude = [
  "/.uv-cache",
  "/.venv",
  "/dist",
  "/.pytest_cache",
  "/**/__pycache__",
  "/**/*.pyc",
  "/state/repos/*.yaml",
  "/state/runs/**",
  "/state/issues/todo/*.md",
  "/state/issues/execution/*.md",
  "/state/issues/archive/*.md",
  "/worktrees/**",
]

[tool.hatch.build.targets.sdist]
include = [
  "/.claude-plugin",
  "/.codex-plugin",
  "/.cursor-plugin",
  "/docs",
  "/hooks",
  "/references",
  "/scripts",
  "/skills",
  "/src",
  "/state/**/*.gitkeep",
  "/worktrees/.gitkeep",
  "/README.md",
  "/Justfile",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/go_ship_it"]

[tool.hatch.build.targets.wheel.force-include]
".claude-plugin" = "go_ship_it/package/.claude-plugin"
".codex-plugin" = "go_ship_it/package/.codex-plugin"
".cursor-plugin" = "go_ship_it/package/.cursor-plugin"
"docs" = "go_ship_it/package/docs"
"hooks" = "go_ship_it/package/hooks"
"references" = "go_ship_it/package/references"
"scripts" = "go_ship_it/package/scripts"
"skills" = "go_ship_it/package/skills"
"README.md" = "go_ship_it/package/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
